name: Probe PyTorch MPS on standard macOS runner

on:
  push:
    branches:
      - experiment/cifar10-mps-probe-20260727

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch
        run: python -m pip install --quiet torch torchvision
      - name: Probe MPS and a convolution backward pass
        run: |
          python - <<'PY'
          import platform
          import torch
          print('platform', platform.platform())
          print('machine', platform.machine())
          print('torch', torch.__version__)
          print('mps_built', torch.backends.mps.is_built())
          print('mps_available', torch.backends.mps.is_available())
          if not torch.backends.mps.is_available():
              raise SystemExit('MPS is not available')
          device = torch.device('mps')
          model = torch.nn.Sequential(
              torch.nn.Conv2d(3, 64, 3, padding=1),
              torch.nn.BatchNorm2d(64),
              torch.nn.ReLU(),
              torch.nn.AdaptiveAvgPool2d(1),
              torch.nn.Flatten(),
              torch.nn.Linear(64, 10),
          ).to(device)
          x = torch.randn(128, 3, 32, 32, device=device)
          y = torch.randint(0, 10, (128,), device=device)
          loss = torch.nn.functional.cross_entropy(model(x), y)
          loss.backward()
          torch.mps.synchronize()
          print('mps_backward_pass', 'success', 'loss', float(loss.cpu()))
          PY
